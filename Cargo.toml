[workspace]
members = [
  "api",
  "daemon",
  "tmux-actuator",
  "tmux-model",
  "tmux-monitor",
  "tui",
  "types"
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["io-util", "net", "macros", "rt-multi-thread", "sync"] }
yes-claude-api = { path = "api" }
yes-claude-tmux-actuator = { path = "tmux-actuator" }
yes-claude-tmux-model = { path = "tmux-model" }
yes-claude-tmux-monitor = { path = "tmux-monitor" }
yes-claude-types = { path = "types" }
